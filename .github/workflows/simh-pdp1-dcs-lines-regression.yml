name: SIMH PDP-1 DCS line resize probe

on:
  push:
    branches:
      - eve/simh-pdp1-dcs-lines-bug
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out lab branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcre3-dev libedit-dev libpng-dev libsdl2-dev

      - name: Build current stock SIMH PDP-1
        run: |
          git clone https://github.com/simh/simh.git /tmp/simh
          echo "SIMH_COMMIT=$(git -C /tmp/simh rev-parse HEAD)" | tee /tmp/simh-commit.txt
          make -C /tmp/simh pdp1
          test -x /tmp/simh/BIN/pdp1

      - name: Probe DCS line shrink then regrow
        run: |
          cat >/tmp/dcs-lines.ini <<'EOF'
          set dcs enable
          show dcs
          show dcsl4
          set dcs lines=4
          show dcs
          show dcsl4
          set dcs lines=8
          show dcs
          show dcsl4
          show dcsl7
          exit
          EOF
          /tmp/simh/BIN/pdp1 /tmp/dcs-lines.ini | tee /tmp/dcs-lines.log

      - name: Apply candidate fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/simh/PDP1/pdp1_dcs.c")
          lines = p.read_bytes().splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if b"if (newln < DCS_LINES) {" in line]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one candidate line, found {len(matches)}")
          i = matches[0]
          eol = bytes([13, 10]) if lines[i].endswith(bytes([13, 10])) else bytes([10])
          lines[i] = b"if (newln < DCS_NUMLIN) {" + eol
          p.write_bytes(b"".join(lines))
          PY
          git -C /tmp/simh diff --check
          printf '1\t1\tPDP1/pdp1_dcs.c\n' >/tmp/expected-numstat.txt
          git -C /tmp/simh diff --numstat -- PDP1/pdp1_dcs.c >/tmp/actual-numstat.txt
          diff -u /tmp/expected-numstat.txt /tmp/actual-numstat.txt
          git -C /tmp/simh diff -- PDP1/pdp1_dcs.c
          make -C /tmp/simh pdp1

      - name: Verify DCS lines re-enable after regrow
        run: |
          probe_resize () {
            low="$1"
            high="$2"
            unit_a="$3"
            unit_b="${4:-}"
            tag="${low}-to-${high}"
            ini="/tmp/dcs-${tag}.ini"
            log="/tmp/dcs-${tag}.log"
            {
              echo "set dcs enable"
              echo "set dcs lines=${low}"
              echo "set dcs lines=${high}"
              echo "show dcs"
              echo "show dcsl${unit_a}"
              if [ -n "${unit_b}" ]; then
                echo "show dcsl${unit_b}"
              fi
              echo "exit"
            } >"${ini}"
            /tmp/simh/BIN/pdp1 "${ini}" | tee "${log}"
            grep -q "lines=${high}" "${log}"
            grep -q "^DCSL${unit_a}[[:space:]]\+UC" "${log}"
            if [ -n "${unit_b}" ]; then
              grep -q "^DCSL${unit_b}[[:space:]]\+UC" "${log}"
            fi
            ! grep -q 'Unit disabled' "${log}"
          }

          probe_resize 4 8 4 7
          probe_resize 1 2 1
          probe_resize 31 32 31
          probe_resize 4 31 4 30

          cat >/tmp/dcs-multistep.ini <<'EOF'
          set dcs enable
          set dcs lines=8
          set dcs lines=4
          set dcs lines=16
          show dcs
          show dcsl4
          show dcsl15
          exit
          EOF
          /tmp/simh/BIN/pdp1 /tmp/dcs-multistep.ini | tee /tmp/dcs-multistep.log
          grep -q 'lines=16' /tmp/dcs-multistep.log
          grep -q '^DCSL4[[:space:]]\+UC' /tmp/dcs-multistep.log
          grep -q '^DCSL15[[:space:]]\+UC' /tmp/dcs-multistep.log
          ! grep -q 'Unit disabled' /tmp/dcs-multistep.log

      - name: Preserve probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdp1-dcs-lines-probe
          path: |
            /tmp/dcs-lines.ini
            /tmp/dcs-lines.log
            /tmp/dcs-*.ini
            /tmp/dcs-*.log
            /tmp/actual-numstat.txt
            /tmp/expected-numstat.txt
            /tmp/simh-commit.txt
          if-no-files-found: error
