name: Eve Adventure stock SIMH experiment

on:
  push:
    branches:
      - eve/adventure-stock-simh
  workflow_dispatch:

jobs:
  build-adventure-simh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libpcre3-dev libedit-dev libpng-dev

      - name: Build AM1 assembler only
        run: make -C Tools/AM1 am1

      - name: Build Adventure data tools
        run: |
          make -C FunStuff/Adventure/AdvDataLoader
          make -C FunStuff/Adventure/AdvDataLoader install

      - name: Generate Adventure tables and drum tracks
        working-directory: FunStuff/Adventure
        run: ./advdataloader AdvDataLoader/adventure.adv

      - name: Assemble stock-SIMH compatibility build
        working-directory: FunStuff/Adventure
        env:
          AM1INCDIR: ${{ github.workspace }}/Am1Includes
        run: |
          export PATH="${{ github.workspace }}/Tools/AM1:$PATH"
          am1 -DSIMH_COMPAT adventure.am1
          mv adventure.rim adventure-simh.rim

      - name: Build stock-SIMH drum image
        working-directory: FunStuff/Adventure
        run: ./advdrumloader -i simh-drum.img advtracks.drm

      - name: Build stock SIMH PDP-1
        run: |
          git clone --depth 1 https://github.com/simh/simh.git .ci-simh
          make -C .ci-simh pdp1 NOVIDEO=1 TESTS=0
          test -x .ci-simh/BIN/pdp1
          .ci-simh/BIN/pdp1 -v

      - name: Play Adventure on stock SIMH through DCS
        run: |
          cat > /tmp/adventure-simh.ini <<EOF
          set cpu pdp1d48
          set cpu 16k
          set drp enabled
          attach drp ${{ github.workspace }}/FunStuff/Adventure/simh-drum.img
          set dcs enabled
          set dcs lines=1
          set dcsl0 8b
          attach dcs 20301
          deposit ss 2
          attach ptr ${{ github.workspace }}/FunStuff/Adventure/adventure-simh.rim
          boot ptr
          EOF

          timeout 60s .ci-simh/BIN/pdp1 /tmp/adventure-simh.ini > /tmp/adventure-simh.log 2>&1 &
          SIMH_PID=$!
          trap 'kill "$SIMH_PID" 2>/dev/null || true' EXIT

          python3 - <<'PY'
          import socket
          import time

          def connect(port, timeout=20):
              deadline = time.time() + timeout
              last_error = None
              while time.time() < deadline:
                  try:
                      return socket.create_connection(("127.0.0.1", port), timeout=1)
                  except OSError as exc:
                      last_error = exc
                      time.sleep(0.2)
              raise SystemExit(f"DCS listener did not open: {last_error}")

          def receive_until(sock, transcript, needle, timeout=20):
              deadline = time.time() + timeout
              target = needle.encode("ascii")
              while time.time() < deadline:
                  if target in transcript:
                      return
                  try:
                      chunk = sock.recv(4096)
                  except socket.timeout:
                      continue
                  if not chunk:
                      break
                  transcript.extend(chunk)
              text = bytes(transcript).decode("ascii", errors="replace")
              raise SystemExit(f"Did not receive expected text {needle!r}. Transcript:\n{text}")

          sock = connect(20301)
          with sock:
              sock.settimeout(0.5)
              transcript = bytearray()

              # Stock SIMH exposes character-ready, but no guest-visible TCP
              # connection-status bit. The compatibility path therefore uses
              # the first received byte purely as a session-start event.
              sock.sendall(b"\r")
              receive_until(sock, transcript, "WOULD YOU LIKE INSTRUCTIONS?")

              # Exercise the receive path and enter the real game.
              sock.sendall(b"NO\r")
              receive_until(sock, transcript, "YOU ARE STANDING AT THE END OF A ROAD BEFORE A SMALL BRICK BUILDING.")

              # Exercise another complete command/response cycle so this is
              # more than a banner test.
              sock.sendall(b"INVENTORY\r")
              receive_until(sock, transcript, "YOU ARE EMPTY-HANDED.")

              text = bytes(transcript).decode("ascii", errors="replace")
              print(text)

              for expected in (
                  "WELCOME TO ADVENTURE ON THE PDP-1!",
                  "WOULD YOU LIKE INSTRUCTIONS?",
                  "YOU ARE STANDING AT THE END OF A ROAD BEFORE A SMALL BRICK BUILDING.",
                  "YOU ARE EMPTY-HANDED.",
              ):
                  if expected not in text:
                      raise SystemExit(f"Missing expected Adventure text: {expected}")
          PY

          echo "--- stock SIMH console log ---"
          cat /tmp/adventure-simh.log

      - name: Show build outputs
        working-directory: FunStuff/Adventure
        run: ls -lh adventure-simh.rim simh-drum.img advtracks.drm

      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: adventure-stock-simh-experiment
          path: |
            FunStuff/Adventure/adventure-simh.rim
            FunStuff/Adventure/simh-drum.img
            FunStuff/Adventure/advtracks.drm
