name: ZMachine stock SIMH lab

on:
  push:
    branches:
      - eve/zmachine-stock-simh-lab
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out lab branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison netcat-openbsd inetutils-telnet libpcre3-dev libedit-dev libpng-dev libsdl2-dev
          sudo mkdir -p /opt
          sudo ln -s "$GITHUB_WORKSPACE" /opt/pidp1-mods
          mkdir -p "$GITHUB_WORKSPACE/bin"

      - name: Build AM1
        run: |
          make -C Tools/AM1 install
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: Verify native ZMachine still builds
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          make -C FunStuff/ZMachine clean
          make -C FunStuff/ZMachine
          test -s FunStuff/ZMachine/zmachine.rim
          test -x FunStuff/ZMachine/zloader

      - name: Verify guarded SIMH_COMPAT ZMachine assembles
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          make -C FunStuff/ZMachine clean
          make -C FunStuff/ZMachine SIMH_COMPAT=1
          test -s FunStuff/ZMachine/zmachine.rim
          test -x FunStuff/ZMachine/zloader

      - name: Generate SIMH_COMPAT assembly map
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          cd FunStuff/ZMachine/Interpreter/build_prod
          am1 -d -S -i /opt/pidp1-mods/Am1Includes -I /opt/pidp1-mods/Am1Includes/UTIL \
              -DZ_TEST_HARNESS=0 -DZLPT_TYPE64=0 -DSIMH_COMPAT=1 \
              ../zmemcore.am1 >/tmp/zmachine-am1-map.out 2>&1
          grep -n -C 5 '174215' zmemcore.lst || true
          grep -E 'zTextDcs|zSessionReset|simhtcc' zmemcore.sym || true

      - name: Build pinned stock SIMH PDP-1
        run: |
          git clone https://github.com/simh/simh.git /tmp/simh
          git -C /tmp/simh checkout 47b7ddabbe5b548cfc32f2fd45f7bed238ff7921
          make -C /tmp/simh pdp1
          test -x /tmp/simh/BIN/pdp1

      - name: Record stock clock target
        run: |
          grep -q 'int32 clk_cntr = 0' /tmp/simh/PDP1/pdp1_clk.c
          grep -q 'CLK_HWRE_TPS    1000' /tmp/simh/PDP1/pdp1_clk.c
          grep -q 'return clk_cntr + incr' /tmp/simh/PDP1/pdp1_clk.c
          grep -q '#define rck iot 32' Am1Includes/CLOCK/clockdefs.ah
          echo "Stock SIMH and pidp1-mods both expose RCK as PDP-1 IOT 32; timed-read compatibility can use the stock 1 ms counter."

      - name: Probe Zork I boot on stock SIMH
        working-directory: FunStuff/ZMachine
        run: |
          ./zloader -i simh-drum.img Games/zork1.z3
          /tmp/simh/BIN/pdp1 zmachine-simh.ini >/tmp/zmachine-simh.log 2>&1 &
          echo $! >/tmp/zmachine-simh.pid

          ready=0
          for i in $(seq 1 80); do
            if nc -z 127.0.0.1 2031; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat /tmp/zmachine-simh.pid)" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            echo 'SIMH exited before the DCS listener stayed available:'
            cat /tmp/zmachine-simh.log || true
            exit 1
          fi

          (
            sleep 1
            # One byte is the stock-SIMH session-start handshake.  It is
            # consumed by the guest before output begins.
            printf 'X'
            sleep 6
            printf 'LOOK\r\n'
            sleep 4
          ) | timeout 14 telnet 127.0.0.1 2031 > /tmp/zmachine-session.txt 2>&1 || true

          echo '--- terminal transcript ---'
          cat /tmp/zmachine-session.txt || true
          echo '--- simulator log ---'
          cat /tmp/zmachine-simh.log || true

          kill "$(cat /tmp/zmachine-simh.pid)" 2>/dev/null || true
          wait "$(cat /tmp/zmachine-simh.pid)" 2>/dev/null || true

      - name: Preserve first-probe transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zmachine-stock-simh-first-probe
          path: |
            /tmp/zmachine-session.txt
            /tmp/zmachine-simh.log
            /tmp/zmachine-am1-map.out
            FunStuff/ZMachine/Interpreter/build_prod/zmemcore.lst
            FunStuff/ZMachine/Interpreter/build_prod/zmemcore.sym
          if-no-files-found: ignore
