; Stock SIMH PDP-1 configuration for the ZMachine compatibility lab.
; Run from FunStuff/ZMachine after:
;     make SIMH_COMPAT=1
;     ./zloader -i simh-drum.img Games/zork1.z3
;
; Then connect to localhost port 2031.  The current lab compatibility layer
; still has known DCS echo/session differences; this file is deliberately a
; bring-up target, not a claim of full compatibility.

set cpu pdp1d48
; ZMachine uses banks 0..15, so configure the full 64K-word address space.
set cpu 64k

set drp enabled
attach drp simh-drum.img

; Stock SIMH's PDP-1 clock supplies RCK (IOT 32), used by the planned timed
; input compatibility shim.
set clk enabled

set dcs enabled
set dcs lines=1
set dcsl0 8b
attach dcs 2031

attach ptr zmachine.rim
boot ptr
