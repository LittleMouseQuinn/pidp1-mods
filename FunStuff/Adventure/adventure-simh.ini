; Stock SIMH PDP-1 configuration for Adventure.
; Run from FunStuff/Adventure after:
;     make adventure-simh
;
; Then connect to localhost port 2030 and press Enter once to start a session.
; Sense switch 5 is set so Adventure disables its time-dependent features and
; does not require the pidp1-mods Chrono-Log clock IOT.

set cpu pdp1d48
set cpu 16k

set drp enabled
attach drp simh-drum.img

set dcs enabled
set dcs lines=1
set dcsl0 8b
attach dcs 2030

deposit ss 2

attach ptr adventure-simh.rim
boot ptr
